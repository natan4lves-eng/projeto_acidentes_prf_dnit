name: CI — Validação do Pipeline

on:
  push:
    branches-ignore:
      - main  # CI roda em qualquer branch EXCETO main (main é destino do PR, não origem)

jobs:
  # ==========================================
  # JOB 1: VALIDAÇÃO DE CÓDIGO
  # ==========================================
  validate:
    name: Lint e Validação dos Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências de CI
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyflakes

      - name: Lint — verificar erros de sintaxe (erro crítico)
        run: |
          # Para o pipeline se houver erro de sintaxe em qualquer script
          flake8 scripts/ \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Lint — verificar qualidade geral (aviso, não bloqueia)
        run: |
          flake8 scripts/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501 \
            --statistics || true  # Não quebra o pipeline, só reporta

      - name: Verificar imports dos scripts principais
        run: |
          # Garante que os scripts são válidos sintaticamente (parse sem executar)
          python -c "
          import ast, sys, pathlib

          scripts = list(pathlib.Path('scripts').glob('*.py'))
          if not scripts:
              print('AVISO: Nenhum script encontrado em scripts/')
              sys.exit(0)

          erros = []
          for script in scripts:
              try:
                  ast.parse(script.read_text(encoding='utf-8'))
                  print(f'  OK  {script.name}')
              except SyntaxError as e:
                  erros.append(f'  ERRO {script.name}: linha {e.lineno} — {e.msg}')

          if erros:
              print('\nErros de sintaxe encontrados:')
              for e in erros:
                  print(e)
              sys.exit(1)
          else:
              print(f'\nTodos os {len(scripts)} scripts validados com sucesso.')
          "

      - name: Verificar presença dos arquivos obrigatórios
        run: |
          python -c "
          import sys, pathlib

          obrigatorios = [
              'scripts/utils.py',
              'scripts/01_glue_processa_bronze.py',
              'scripts/02_glue_processa_silver.py',
              'scripts/03_glue_processa_gold.py',
              'terraform/main.tf',
              'terraform/iam_role.tf',
              'terraform/variables.tf',
          ]

          faltando = [f for f in obrigatorios if not pathlib.Path(f).exists()]

          if faltando:
              print('Arquivos obrigatórios ausentes:')
              for f in faltando:
                  print(f'  FALTANDO: {f}')
              sys.exit(1)
          else:
              print('Todos os arquivos obrigatórios presentes.')
          "

  # ==========================================
  # JOB 2: VALIDAÇÃO DO TERRAFORM
  # ==========================================
  terraform-validate:
    name: Terraform Validate e Fmt
    runs-on: ubuntu-latest
    needs: validate  # Só roda se o Job 1 passar

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.7'

      - name: Terraform Init (sem backend remoto)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          echo "Formatação Terraform OK."

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate
          echo "Configuração Terraform válida."
