name: CI — Validação do Pipeline

on:
  push:
    branches-ignore:
      - main

jobs:
  validate:
    name: Validação dos Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar sintaxe dos scripts Python
        run: |
          python -m py_compile scripts/utils.py
          python -m py_compile scripts/01_glue_processa_bronze.py
          python -m py_compile scripts/02_glue_processa_silver.py
          python -m py_compile scripts/03_glue_processa_gold.py
          echo "Todos os scripts OK."
